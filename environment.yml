name: nsclc_survival
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # GPU-enabled PyTorch (change cudatoolkit version as needed)
  - pytorch=2.2.2
  - torchvision=0.17.2
  - pytorch-cuda=11.8
  - pip:
    - nibabel==5.2.1
    - scikit-image==0.22.0
    - SimpleITK==2.3.1
    - tcia_utils==2.5.3
    - lifelines==0.29.0
    - scikit-survival==0.22.2
    - numpy==1.26.4
    - scipy==1.13.0
    - pandas==2.2.1
    - scikit-learn==1.4.2
    - huggingface_hub==0.22.2
    - transformers==4.40.0
    - matplotlib==3.8.4
    - tqdm==4.66.2
    - pyyaml==6.0.1
